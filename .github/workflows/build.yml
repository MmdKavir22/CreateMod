name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and wrapper distributions.
      - uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then echo "::error::version not found in gradle.properties"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The executable bit is lost when files are uploaded via the GitHub web UI or from Windows.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Locate mod jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n 1)
          if [ -z "$JAR" ]; then echo "::error::No jar found in build/libs"; exit 1; fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: testmod-${{ steps.version.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create tags/releases
    env:
      TAG: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fail if release already exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump 'version' in gradle.properties before releasing again."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: testmod-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub release
        run: |
          gh release create "$TAG" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "Test Mod $TAG" \
            --generate-notes
