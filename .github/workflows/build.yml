name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - run: gradle build --no-daemon
      - name: Find jar
        run: echo "JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ctjs-fabric-26.2
          path: ${{ env.JAR }}
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChatTriggers Fabric 26.2 - build ${{ github.run_number }}
          body: Automatic build of commit ${{ github.sha }}
          files: ${{ env.JAR }}
          make_latest: true
