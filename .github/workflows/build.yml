name: Build NecromancerFX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :api:build :plugin:build
      - uses: actions/upload-artifact@v4
        with:
          name: necromancerfx-jars
          path: |
            api/build/libs/*.jar
            plugin/build/libs/*.jar
