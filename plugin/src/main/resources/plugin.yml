name: NecromancerFX
version: '${version}'
main: ir.mmdkavir.necrofx.plugin.NecromancerFXPlugin
api-version: '1.21'
author: mmdkavir
description: Server-side custom mob framework
commands:
  necromancerfx:
    description: NecromancerFX administration
    usage: /necromancerfx <status|mobs|reload>
    aliases: [nxfx]
    permission: necromancerfx.command
permissions:
  necromancerfx.command: { default: op }
  necromancerfx.admin: { default: op }
