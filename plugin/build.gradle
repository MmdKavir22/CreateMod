plugins { id 'java' }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'; implementation project(':api') }
jar { archiveBaseName.set('necromancerfx-plugin'); from { configurations.runtimeClasspath.collect { it.isDirectory()?it:zipTree(it) } }; duplicatesStrategy=DuplicatesStrategy.EXCLUDE }
processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
